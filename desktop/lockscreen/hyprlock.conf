source = ~/.config/hypr/generated-lock.conf

general {
  disable_loading_bar = true
  hide_cursor = true
  immediate_render = true
}

animations {
  enabled = true
  bezier = infinityEase, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 5, infinityEase
  animation = fadeOut, 1, 4, infinityEase
  animation = inputFieldColors, 1, 3, infinityEase
  animation = inputFieldDots, 1, 2, infinityEase
  animation = inputFieldWidth, 1, 3, infinityEase
}

background {
  monitor =
  path = ~/.local/share/infinity-os/current-wallpaper.svg
  blur_passes = 2
  blur_size = 4
  color = $infinityLockBackground
  brightness = 0.72
  contrast = 1.05
  vibrancy = 0.12
}

input-field {
  monitor =
  size = 340, 58
  position = 0, -96
  halign = center
  valign = center
  outline_thickness = 2
  rounding = 8
  inner_color = $infinityLockSurface
  outer_color = $infinityLockBorder
  font_color = $infinityLockText
  check_color = $infinityLockAccent
  fail_color = $infinityLockError
  placeholder_text = <span foreground="##a0a0a0">Enter password</span>
  fail_text = <span foreground="##ffb0b0">$FAIL</span>
  dots_size = 0.22
  dots_spacing = 0.22
  fade_on_empty = false
}

label {
  monitor =
  text = $TIME
  color = $infinityLockText
  font_family = IBM Plex Sans
  font_size = 74
  position = 0, 86
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date '+%A, %d %B'
  color = $infinityLockText
  font_family = IBM Plex Mono
  font_size = 13
  position = 0, 34
  halign = center
  valign = center
}

label {
  monitor =
  text = INFINITY / SECURE FIELD
  color = $infinityLockAccent
  font_family = IBM Plex Mono
  font_size = 10
  position = 0, -158
  halign = center
  valign = center
}
